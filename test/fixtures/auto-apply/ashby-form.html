<!doctype html>
<!--
  Hand-trimmed jobs.ashbyhq.com/<company>/<uuid>/application form (auto-apply
  tests). Required questions are marked only by the _required_ class on the
  question title, not by a required attribute (the resume input has none).
-->
<html>
<head><title>Software Engineer @ Example Co</title></head>
<body>
<div class="ashby-job-posting-right-pane">
<div class="ashby-application-form-container">

    <input placeholder="Type here..." name="_systemfield_name" id="_systemfield_name" type="text" class="ashby-application-form-input" value="">
  </div>
  <div class="_fieldEntry_1 ashby-application-form-field-entry">
    <label class="_heading_1 _required_f7cvd_91 ashby-application-form-question-title" for="_systemfield_email">Email</label>
    <input placeholder="hello@example.com..." name="_systemfield_email" id="_systemfield_email" type="email" class="ashby-application-form-input" value="">
  </div>
  <div class="_fieldEntry_1 ashby-application-form-field-entry">
    <label class="_heading_1 _required_f7cvd_91 ashby-application-form-question-title" for="_systemfield_resume">Resume</label>

  </div>

  </div>

</div>
</div>
</body>
