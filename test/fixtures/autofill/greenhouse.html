<!doctype html>
<!--
  Trimmed from a live job-boards.greenhouse.io application form (Remix +
  react-select build, fetched 2026-10). Company names, question wording that
  identified an employer, inline styles, emotion class hashes, and SVG icons
  were removed. No personal data. The react-select menus are not in the saved
  markup: they mount on interaction, which test/mock_autofill_4.js simulates.
-->
<html>
<head><title>Job Application for Software Engineer at Example Co</title></head>
<body>
<div class="application--container">
<form method="get" action="/exampleco/jobs/1000000001" id="application-form" class="application--form">
<div class="application--questions">
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label>
    <input id="first_name" class="input input__single-line" aria-label="First Name" aria-describedby="first_name-description first_name-error first_name-help" aria-invalid="false" aria-errormessage="first_name-error" aria-required="true" type="text" maxLength="255" autoComplete="given-name" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="last_name-label" for="last_name" class="label label">Last Name<span aria-hidden="true">*</span></label>
    <input id="last_name" class="input input__single-line" aria-label="Last Name" aria-describedby="last_name-description last_name-error last_name-help" aria-invalid="false" aria-errormessage="last_name-error" aria-required="true" type="text" maxLength="255" autoComplete="family-name" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="preferred_name-label" for="preferred_name" class="label label">Preferred First Name</label>
    <input id="preferred_name" class="input input__single-line" aria-label="Preferred First Name" aria-invalid="false" aria-required="false" type="text" maxLength="255" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label>
    <input id="email" class="input input__single-line" aria-label="Email" aria-invalid="false" aria-errormessage="email-error" aria-required="true" type="text" maxLength="255" autoComplete="email" value=""/>
  </div></div></div>
  <div class="field-wrapper"><fieldset class="phone-input"><legend class="visually-hidden">Phone</legend>
    <div class="phone-input__country"><div class="select"><div class="select__container">
      <label id="country-label" for="country" class="label select__label">Country</label>
      <div class="select-shell"><span id="react-select-country-live-region" class="a11yText"></span>
        <div><div class="select__control">
          <div class="select__value-container">
            <div class="select__placeholder" id="react-select-country-placeholder">Select...</div>
            <div class="select__input-container" data-value=""><input class="select__input" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="country" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="country-error" aria-invalid="false" aria-labelledby="country-label" aria-required="false" role="combobox" aria-activedescendant="" aria-describedby="react-select-country-placeholder" enterKeyHint="done" value=""/></div>
          </div>
          <div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div>
        </div></div>
      </div>
    </div></div></div>
    <div class="phone-input__phone"><div class="text-input-wrapper"><div class="input-wrapper">
      <label id="phone-label" for="phone" class="label label">Phone</label>
      <input id="phone" class="input input__single-line" aria-label="Phone" aria-invalid="false" aria-errormessage="phone-error" aria-required="false" type="tel" maxLength="255"/>
    </div></div></div>
  </fieldset></div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)<span aria-hidden="true">*</span></label>
    <div class="select-shell"><span id="react-select-candidate-location-live-region" class="a11yText"></span>
      <div><div class="select__control">
        <div class="select__value-container">
          <div class="select__placeholder" id="react-select-candidate-location-placeholder"></div>
          <div class="select__input-container" data-value=""><input class="select__input" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="candidate-location" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="candidate-location-error" aria-invalid="false" aria-labelledby="candidate-location-label" aria-required="true" role="combobox" aria-activedescendant="" enterKeyHint="done" value=""/></div>
        </div>
      </div></div>
    </div>
  </div></div></div>
  <div class="field-wrapper"><div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload" data-allow-s3="false">
    <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
    <div class="file-upload__wrapper"><div class="button-container">
      <div class="secondary-button"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"/></div></div>
      <div class="secondary-button"><div><button type="button" class="btn btn--pill" data-testid="resume-text">Enter manually</button><label class="visually-hidden" for="resume_text">Enter manually</label></div></div>
      <p id="accepted-filetypes" class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
    </div></div>
  </div></div>
  <div class="field-wrapper"><div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload" data-allow-s3="false">
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <div class="file-upload__wrapper"><div class="button-container">
      <div class="secondary-button"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"/></div></div>
    </div></div>
  </div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="question_1000000101-label" for="question_1000000101" class="label label">LinkedIn Profile</label>
    <input id="question_1000000101" class="input input__single-line" aria-label="LinkedIn Profile" aria-describedby="question_1000000101-description question_1000000101-error question_1000000101-help" aria-invalid="false" aria-errormessage="question_1000000101-error" aria-required="false" type="text" maxLength="255" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="question_1000000102-label" for="question_1000000102" class="label label">GitHub Profile</label>
    <input id="question_1000000102" class="input input__single-line" aria-label="GitHub Profile" aria-invalid="false" aria-errormessage="question_1000000102-error" aria-required="false" type="text" maxLength="255" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
    <label id="question_1000000103-label" for="question_1000000103" class="label label">Other Website</label>
    <input id="question_1000000103" class="input input__single-line" aria-label="Other Website" aria-invalid="false" aria-errormessage="question_1000000103-error" aria-required="false" type="text" maxLength="255" value=""/>
  </div></div></div>
  <div class="field-wrapper field-wrapper--multiline"><div class="text-input-wrapper"><div class="input-wrapper input-wrapper__multi-line">
    <label id="question_1000000104-label" for="question_1000000104" class="label label">Why do you want to join us?<span aria-hidden="true">*</span></label>
    <textarea id="question_1000000104" class="input input__multi-line" aria-label="Why do you want to join us?" aria-invalid="false" aria-errormessage="question_1000000104-error" aria-required="true" rows="4"></textarea>
  </div></div></div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="question_1000000105-label" for="question_1000000105" class="label select__label">Will you now or in the future require sponsorship for a visa to remain in your current location?<span aria-hidden="true">*</span></label>
    <div class="select-shell"><span id="react-select-question_1000000105-live-region" class="a11yText"></span>
      <div><div class="select__control">
        <div class="select__value-container">
          <div class="select__placeholder" id="react-select-question_1000000105-placeholder">Select...</div>
          <div class="select__input-container" data-value=""><input class="select__input" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="question_1000000105" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="question_1000000105-error" aria-invalid="false" aria-labelledby="question_1000000105-label" aria-required="true" role="combobox" aria-activedescendant="" aria-describedby="react-select-question_1000000105-placeholder" enterKeyHint="done" value=""/></div>
        </div>
        <div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div>
      </div></div>
    </div>
    <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value=""/>
  </div></div></div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="question_1000000106-label" for="question_1000000106" class="label select__label">Are you legally authorized to work in the country for which you applied?<span aria-hidden="true">*</span></label>
    <div class="select-shell"><span id="react-select-question_1000000106-live-region" class="a11yText"></span>
      <div><div class="select__control">
        <div class="select__value-container">
          <div class="select__placeholder" id="react-select-question_1000000106-placeholder">Select...</div>
          <div class="select__input-container" data-value=""><input class="select__input" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="question_1000000106" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-invalid="false" aria-labelledby="question_1000000106-label" aria-required="true" role="combobox" aria-activedescendant="" enterKeyHint="done" value=""/></div>
        </div>
      </div></div>
    </div>
    <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value=""/>
  </div></div></div>
</div>
<div class="eeoc__container">
  <div class="eeoc__question__wrapper"><div class="select"><div class="select__container">
    <label id="gender-label" for="gender" class="label select__label">Gender</label>
    <div class="select-shell"><span id="react-select-gender-live-region" class="a11yText"></span>
      <div><div class="select__control">
        <div class="select__value-container">
          <div class="select__placeholder" id="react-select-gender-placeholder">Select...</div>
          <div class="select__input-container" data-value=""><input class="select__input" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="gender" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-invalid="false" aria-labelledby="gender-label" aria-required="false" role="combobox" aria-activedescendant="" enterKeyHint="done" value=""/></div>
        </div>
      </div></div>
    </div>
  </div></div></div>
</div>
<div class="application--submit"><button type="submit" class="btn btn--rounded">Submit application</button></div>
</form>
</div>
</body>
</html>
